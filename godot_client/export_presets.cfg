; adventure-snowcrash Godot client — desktop export presets (#149 / #132).
; Open in Godot 4.3+ → Project → Export. The editor may rewrite this file;
; keep Linux x86_64 as the primary Steam Deck / Linux depot path.
;
; Templates: Editor → Manage Export Templates → Download and Install
; (must match the editor minor, e.g. 4.3.x or 4.4.1+ if using GodotSteam).
; Headless: ./scripts/export_godot_client.sh  (see docs/godot-desktop-export.md)
; Do NOT upload to SteamPipe without approval (docs/steam-packaging.md / #67).

[preset.0]

name="Linux/X11 (Steam Deck / desktop)"
platform="Linux/X11"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/linux/Snowcrash.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/windows/Snowcrash.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/bptc=true
